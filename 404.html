<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#faf7ff">
  <title>404 — PAGES</title>
  <meta name="description" content="The link may be outdated or incomplete. Return to PAGES to find your Circles.">
  <style>
:root{color-scheme:light;--bg:#f7efff;--surface:#fcfaff;--ink:#321d4d;--muted:#69577a;--accent:#63388d}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;
background:radial-gradient(ellipse at 0% 0%,#a784d455,transparent 50%),
radial-gradient(ellipse at 100% 100%,#8752c355,transparent 48%),linear-gradient(140deg,#fbf8ff,#e7d6f5);
color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{width:min(680px,calc(100% - 36px));padding:clamp(32px,6vw,68px);border:1px solid #bfa7da;border-radius:25px;
background:#fffefaee;box-shadow:0 20px 80px #311b4730}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:750;color:var(--accent)}
.code{margin:22px 0 4px;color:var(--accent);font:800 64px/1 Georgia,serif}
h1{font:700 clamp(30px,6vw,52px)/1.14 Georgia,serif;margin:18px 0}
p{color:var(--muted);max-width:510px}.cta{display:inline-block;margin-top:18px;border:1px solid var(--accent);
border-radius:9px;padding:12px 21px;text-decoration:none;color:var(--ink);font-weight:750}
.cta:focus-visible,.foot a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.foot{margin-top:25px;font-size:13px;color:var(--muted)}.foot a{color:var(--accent)}
</style>
</head>
<body>
<main>
 <div class="eyebrow">PAGES · BUILD A LIFE TOGETHER</div>
 <div class="code" aria-label="Error 404">404</div>
 <h1>This page hasn't been written.</h1>
 <p>The link may be outdated or incomplete. Return to PAGES to find your Circles.</p>
 <a class="cta" href="/pages-app/">Return to PAGES &rarr;</a>
 <div class="foot">This link doesn't point to an available page. <a href="/pages-app/">Home</a></div>
</main>
</body>
</html>
