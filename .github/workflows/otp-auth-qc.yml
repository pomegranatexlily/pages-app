name: PAGES email code regression checks
on:
  push:
    paths:
      - "js/views/auth.js"
      - "js/store/supabase-adapter.js"
      - "supabase/email-templates/**"
      - "privacy.html"
      - "tests/otp-auth.test.mjs"
      - ".github/workflows/otp-auth-qc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-code-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check js/views/auth.js
      - run: node --check js/store/supabase-adapter.js
      - run: node tests/otp-auth.test.mjs
