name: Studio content and UI-lock checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/studio-landing-page-ux]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check studio.js
      - run: node --test tests/studio.test.cjs
