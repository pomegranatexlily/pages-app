name: Clear legacy Pages application without backup
on:
  push:
    branches: [main]
    paths: [.github/workflows/clear-pages-for-studio.yml]
permissions:
  contents: write
concurrency:
  group: clear-pages-for-studio
  cancel-in-progress: false
jobs:
  clear:
    if: github.repository == 'pomegranatexlily/pages-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Guard approved starting point and remove tracked files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0aa0a3234121f1da2e64a85092ae0410d73e4996"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch -- .
          git commit -m "Remove legacy Pages application for approved studio replacement"
          git push origin HEAD:main
